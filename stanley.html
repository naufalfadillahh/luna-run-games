<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Botol Minum 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9ecf1;font-family:system-ui,Arial,sans-serif}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  #sw{display:flex;gap:10px;pointer-events:auto;background:rgba(255,255,255,.75);padding:10px 14px;border-radius:40px;backdrop-filter:blur(8px)}
  .c{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .c.on{border-color:#222}
  #hint{font-size:13px;color:#555}
  #name{position:fixed;top:16px;left:0;right:0;text-align:center;font-weight:700;font-size:18px;color:#333}
</style>
</head>
<body>
<div id="name">Tumbler 40 oz</div>
<div id="ui"><div id="sw"></div><div id="hint">Geser untuk memutar · scroll / cubit untuk zoom · klik tutup untuk buka-tutup</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = () => innerWidth, H = () => innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecf1);
const camera = new THREE.PerspectiveCamera(35, W()/H(), .1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3b5, .9));
const key = new THREE.DirectionalLight(0xffffff, .9);
key.position.set(5,12,8); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-8,right:8,top:8,bottom:-8});
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, .5); rim.position.set(-8,5,-6); scene.add(rim);

// lantai
const floor = new THREE.Mesh(new THREE.CircleGeometry(14,64), new THREE.ShadowMaterial({opacity:.22}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

const group = new THREE.Group(); scene.add(group);
const coat = new THREE.MeshPhysicalMaterial({color:0x2f6f6a, metalness:.25, roughness:.42, clearcoat:.5, clearcoatRoughness:.35});
const dark = new THREE.MeshStandardMaterial({color:0x1b1d22, roughness:.55, metalness:.1});
const steel = new THREE.MeshStandardMaterial({color:0xcfd3da, roughness:.25, metalness:.9});
const clear = new THREE.MeshPhysicalMaterial({color:0xffffff, roughness:.1, transmission:0, transparent:true, opacity:.55});
function add(geo, mat, parent=group){ const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }

// radius badan pada ketinggian y (meruncing ke bawah)
const R0=1.5, R1=2.15, BH=8;
const rAt = y => R0 + (R1-R0)*Math.min(Math.max(y/BH,0),1);

// badan (lathe, kosong di dalam supaya terlihat tebal di bibir)
const prof = [];
prof.push(new THREE.Vector2(0.001,0));
for (let i=0;i<=6;i++){ const a=i/6*Math.PI/2; prof.push(new THREE.Vector2(R0-0.25+Math.sin(a)*0.25, 0.25-Math.cos(a)*0.25)); }
for (let y=0.5;y<=BH;y+=0.5) prof.push(new THREE.Vector2(rAt(y), y));
prof.push(new THREE.Vector2(R1-0.06, BH));
add(new THREE.LatheGeometry(prof,64), coat);

// cincin dasar
add(new THREE.CylinderGeometry(R0+0.02,R0+0.02,0.35,64), dark).position.y = 0.17;

// tutup
const lid = new THREE.Group(); lid.position.y = BH; group.add(lid);
add(new THREE.CylinderGeometry(R1+0.04,R1+0.04,0.45,64), dark, lid).position.y = 0.22;
const dome = add(new THREE.CylinderGeometry(R1-0.1,R1+0.02,0.35,64), dark, lid); dome.position.y = 0.62;
add(new THREE.CylinderGeometry(R1-0.25,R1-0.1,0.12,64), dark, lid).position.y = 0.85;
// lubang sedotan + penutup geser
const hole = add(new THREE.CylinderGeometry(0.34,0.34,0.06,32), steel, lid); hole.position.set(0.55,0.92,0);
const cover = new THREE.Group(); cover.position.set(-0.3,0.95,0); lid.add(cover);
const flap = add(new THREE.CylinderGeometry(0.62,0.62,0.12,40), dark, cover); flap.position.set(0.9,0.04,0);
const tab = add(new THREE.BoxGeometry(0.5,0.1,0.35), coat, cover); tab.position.set(0.9,0.12,0);
lid.userData.open = false;

// sedotan
const straw = add(new THREE.CylinderGeometry(0.17,0.17,6.4,24), clear);
straw.position.set(0.55,BH+2.3,0); straw.rotation.z = -0.1;
// ujung sedotan melengkung ke dalam badan tampak dari luar: bagian atas lebih tebal
const sTop = add(new THREE.CylinderGeometry(0.2,0.2,0.4,24), clear); sTop.position.set(0.55+0.2,BH+5.45,0); sTop.rotation.z=-0.1;

// pegangan di sisi +x
const hp = [
  [R0+0.35,1.5],[R0+1.35,2.0],[R1+0.6,3.6],[R1+0.75,5.2],[R1+0.45,6.6],[rAt(7)-0.15,7.1]
].map(([x,y]) => new THREE.Vector3(x+0.0, y, 0));
// titik awal menempel ke badan
hp[0].x = rAt(hp[0].y)-0.1; hp[hp.length-1].x = rAt(hp[hp.length-1].y)-0.1;
const handle = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hp), 48, 0.2, 16, false), coat);

// label di badan
function labelTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
  g.font='bold 92px Georgia, serif'; g.fillText('Quencher',256,105);
  g.font='600 38px system-ui, Arial'; g.fillText('H2.0 · 40 OZ',256,185);
  const t=new THREE.CanvasTexture(c); t.anisotropy=8; return t;
}
const y0=3.0,y1=5.2, span=1.15;
const label = new THREE.Mesh(
  new THREE.CylinderGeometry(rAt(y1)+0.012, rAt(y0)+0.012, y1-y0, 48, 1, true, -span/2, span),
  new THREE.MeshBasicMaterial({map:labelTex(), transparent:true, side:THREE.FrontSide}));
label.position.y = (y0+y1)/2; group.add(label);

group.position.y = -4.3;

// warna
const COLORS = [['#2f6f6a','Hijau Teal'],['#e9a7b8','Pink'],['#1f3b73','Navy'],['#c0392b','Merah'],['#f2efe6','Putih Krem'],['#2a2a2e','Hitam'],['#8e6bbf','Ungu']];
const sw = document.getElementById('sw');
COLORS.forEach(([hex,nm],i)=>{
  const d=document.createElement('div'); d.className='c'+(i===0?' on':''); d.style.background=hex; d.title=nm;
  d.onclick=()=>{ coat.color.set(hex); sw.querySelectorAll('.c').forEach(x=>x.classList.remove('on')); d.classList.add('on'); auto=false; };
  sw.appendChild(d);
});

// kontrol orbit sederhana
let yaw=0.6, pitch=0.18, dist=26, auto=true, dragging=false, moved=0, lx=0, ly=0;
const el = renderer.domElement;
const pts = new Map();
el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); dragging=true; moved=0; lx=e.clientX; ly=e.clientY; auto=false; });
el.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  if(pts.size===2){
    const o=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];
    const d0=Math.hypot(prev[0]-o[0],prev[1]-o[1]), d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);
    dist=Math.min(48,Math.max(12,dist*d0/d1));
  } else {
    const dx=e.clientX-lx, dy=e.clientY-ly; moved+=Math.abs(dx)+Math.abs(dy);
    yaw-=dx*0.01; pitch=Math.min(1.2,Math.max(-0.2,pitch+dy*0.006));
  }
  pts.set(e.pointerId,[e.clientX,e.clientY]); lx=e.clientX; ly=e.clientY;
});
el.addEventListener('pointerup',e=>{
  pts.delete(e.pointerId);
  if(moved<6 && pts.size===0) clickPick(e);
});
el.addEventListener('wheel',e=>{ dist=Math.min(48,Math.max(12,dist*(1+e.deltaY*0.001))); e.preventDefault(); },{passive:false});

// klik tutup: geser penutup lubang
const ray=new THREE.Raycaster();
function clickPick(e){
  const m=new THREE.Vector2(e.clientX/W()*2-1, -(e.clientY/H())*2+1);
  ray.setFromCamera(m,camera);
  if(ray.intersectObjects(lid.children,true).length){ lid.userData.open=!lid.userData.open; }
}

function loop(){
  requestAnimationFrame(loop);
  if(auto) yaw+=0.006;
  camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist, Math.sin(pitch)*dist+1, Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0,0.5,0);
  const target = lid.userData.open ? 1.3 : 0;
  cover.position.x += ((-0.3+target) - cover.position.x)*0.15;
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.updateProjectionMatrix(); });
</script>
</body>
</html>
